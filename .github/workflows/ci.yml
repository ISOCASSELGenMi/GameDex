# 16 §CI／CD。i18n:check、test:a11y、api:check 會在對應 Phase（3a、3.5、API）加入。
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sok
          POSTGRES_PASSWORD: sok_ci_password
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sok" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sok:sok_ci_password@localhost:5432/sok_studio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm -w apps/web run lint
      - run: npm -w apps/web run typecheck
      - run: npm -w apps/web run lint:arch
      - run: npm -w apps/web run test
      - run: npm -w apps/web run build

  # 02 §CI 邊界檢查 d：所有可選模組關閉時，型別檢查、測試、build 都要通過（不需要資料庫）
  core-only:
    runs-on: ubuntu-latest
    env:
      MODULES: none
      METACRITIC_SCRAPE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm -w apps/web run typecheck
      - run: npm -w apps/web run test:unit
      - run: npm -w apps/web run build
